<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>활고자 퀴즈</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="interactions.css"><script defer src="../js/data.js"></script><script defer src="../js/storage.js"></script><script defer src="data.js"></script><script defer src="interactions.js"></script><script defer src="quiz.js"></script></head><body><main class="single"><section class="phone" id="quiz-3"><header><span>궁사의 탐험 수첩</span><small>QR C</small></header><p class="eyebrow">빈칸 채우기 · 문제 3</p><h1>보기에서 알맞은 낱말을 골라 빈칸을 채우세요.</h1><form data-quiz="lower"><div class="drag-task"><p class="help">아래 보기의 낱말을 빈칸으로 드래그하세요. 채운 빈칸을 누르면 취소됩니다.</p><div class="passage">활고자는 활채의 양쪽 끝에 있다. 이곳에 <button type="button" class="drop-slot" data-placeholder="㉠" aria-label="㉠">㉠</button>를 걸어 두면 활채가 <button type="button" class="drop-slot" data-placeholder="㉡" aria-label="㉡">㉡</button> 모양을 유지할 수 있다.</div><div class="drag-bank"><h3>보기</h3><div class="bank-items"><button type="button" class="drag-token" data-key="0">시위</button><button type="button" class="drag-token" data-key="1">화살</button><button type="button" class="drag-token" data-key="2">줌통</button><button type="button" class="drag-token" data-key="3">휘어진</button></div></div></div><button class="submit" type="submit">정답 확인</button><p class="preview-message" role="status"></p></form><a class="back" href="../collection.html">수집북으로 돌아가기</a><p class="footnote">틀려도 괜찮아요. 다시 도전할 수 있어요.</p></section></main></body></html>
