<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>시위 퀴즈</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="interactions.css"><script defer src="data.js"></script><script defer src="interactions.js"></script><script defer src="quiz.js"></script></head><body><main class="single"><section class="phone" id="quiz-4"><header><span>궁사의 탐험 수첩</span><small>QR D</small></header><p class="eyebrow">순서 배열 · 문제 4</p><h1>화살을 쏘는 순서에 맞게 (가)~(마)를 나열하세요.</h1><form data-quiz="string"><div class="drag-task"><p class="help">아래 보기를 순서칸으로 드래그하세요. 넣은 답을 한 번 누르거나 보기 영역으로 끌어내리면 취소됩니다.</p><div class="sequence-targets"><div class="sequence-row"><b>1</b><button type="button" class="drop-slot" data-placeholder="1번째 순서" aria-label="1번째 순서">1번째 순서</button></div><div class="sequence-row"><b>2</b><button type="button" class="drop-slot" data-placeholder="2번째 순서" aria-label="2번째 순서">2번째 순서</button></div><div class="sequence-row"><b>3</b><button type="button" class="drop-slot" data-placeholder="3번째 순서" aria-label="3번째 순서">3번째 순서</button></div><div class="sequence-row"><b>4</b><button type="button" class="drop-slot" data-placeholder="4번째 순서" aria-label="4번째 순서">4번째 순서</button></div><div class="sequence-row"><b>5</b><button type="button" class="drop-slot" data-placeholder="5번째 순서" aria-label="5번째 순서">5번째 순서</button></div></div><div class="drag-bank"><h3>보기</h3><div class="bank-items"><button type="button" class="drag-token" data-key="0">(가) 시위를 놓으면 활채가 펴지며 원래 모양으로 돌아간다.</button><button type="button" class="drag-token" data-key="1">(나) 화살의 오늬를 시위에 끼운다.</button><button type="button" class="drag-token" data-key="2">(다) 활채가 휘면서 힘이 저장된다.</button><button type="button" class="drag-token" data-key="3">(라) 화살이 시위의 힘을 받아 앞으로 날아간다.</button><button type="button" class="drag-token" data-key="4">(마) 시위를 뒤로 당긴다.</button></div></div></div><button class="submit" type="submit">정답 확인</button><p class="preview-message"
