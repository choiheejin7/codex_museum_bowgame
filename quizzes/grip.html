<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>줌통 퀴즈</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="interactions.css"><script defer src="../js/data.js"></script><script defer src="../js/storage.js"></script><script defer src="data.js"></script><script defer src="interactions.js"></script><script defer src="reward.js"></script><script defer src="quiz.js"></script><link rel="stylesheet" href="reward.css"></head><body><main class="single"><section class="phone" id="quiz-1"><header><span>궁사의 탐험 수첩</span><small>QR A</small></header><p class="eyebrow">오지선다형 · 문제 1</p><h1>줌통이 활을 쏠 때 하는 일로 가장 알맞은 것은?</h1><form data-quiz="grip"><label class="option"><input type="radio" name="choice-0" value="0"><span class="number">①</span><span>화살에 힘을 직접 전달해 앞으로 밀어낸다.</span></label><label class="option"><input type="radio" name="choice-0" value="1"><span class="number">②</span><span>궁수가 손으로 쥐어 활을 지탱하고, 조준할 때 흔들리지 않게 해 준다.</span></label><label class="option"><input type="radio" name="choice-0" value="2"><span class="number">③</span><span>화살이 날아가는 동안 방향을 잡아 준다.</span></label><label class="option"><input type="radio" name="choice-0" value="3"><span class="number">④</span><span>과녁에 꽂혀 화살이 빠지지 않게 한다.</span></label><label class="option"><input type="radio" name="choice-0" value="4"><span class="number">⑤</span><span>시위가 풀리지 않게 양쪽 끝에 묶어 둔다.</span></label><button class="submit" type="submit">정답 확인</button><p class="preview-message" role="status"></p></form><a class="back" href="../collection.html">수집북으로 돌아가기</a><p class="footnote">틀려도 괜찮아요. 다시 도전할 수 있어요.</p></section></main></body></html>
