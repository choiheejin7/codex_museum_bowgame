<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>활과 화살 수집북</title><link rel="stylesheet" href="css/style.css"><script defer src="js/data.js"></script><script defer src="js/storage.js"></script><script defer src="js/collection.js"></script><script defer src="js/vendor/jsQR.js"></script><script defer src="js/qr-route.js"></script><script defer src="js/scanner.js"></script></head>
<body><main class="app"><header class="masthead"><a href="index.html">궁사의 탐험 수첩</a><span class="edition">COLLECTION</span></header><div class="page-top"><h1>활과 화살 수집북</h1><p class="muted">빈 조각을 눌러 QR 위치 힌트를 확인하세요.</p></div><div class="progress-block"><div class="progress-label"><span id="progress-text" aria-live="polite">획득 아이템 0 / 7</span><span class="small-tag">나의 탐험 기록</span></div><progress id="collection-progress" value="0" max="7" aria-label="아이템 수집 진행도"></progress></div><section><div class="section-heading"><h2>활</h2><span>네 조각으로 완성하는 활</span></div><div class="item-grid" id="bow-items"></div></section><section><div class="section-heading"><h2>화살</h2><span>세 조각으로 완성하는 화살</span></div><div class="item-grid" id="arrow-items"></div></section><a id="complete-link" class="button secondary" href="complete.html" hidden>완성된 활과 화살 보기</a><section class="scan-entry"><h2>다음 조각을 찾아보세요</h2><p class="muted">QR 스캔을 누르고 박물관의 문제 QR을 비춰주세요.</p><button class="button" id="open-scanner" type="button">QR 스캔</button></section><p class="footnote">한 번의 정답, 하나의 조각. 천천히 탐험해보세요.</p></main><dialog id="item-dialog" aria-labelledby="dialog-title" aria-describedby="dialog-description"><h2 id="dialog-title"></h2><p id="dialog-description"></p><div id="hint-area"><h3>QR 위치 힌트</h3><p id="dialog-hint"></p></div><button class="button" id="close-dialog" type="button">확인</button></dialog><dialog id="scanner-dialog" aria-labelledby="scanner-title">
<h2 id="scanner-title">QR 스캔</h2>
<p class="muted">QR을 비추면 해당 문제로 자동 이동합니다.</p>

<section id="camera-panel" hidden><video id="camera-preview" autoplay muted playsinline aria-label="카메라 미리보기"></video><p id="camera-status" role="status" aria-live="polite"></p><p class="footnote">문제 QR 전체가 화면에 보이도록 비춰주세요. 인식하면 해당 문제로 이동합니다.</p><button id="stop-camera" class="button secondary" type="button">수집북으로 돌아가기</button></section>


</dialog></body></html>
