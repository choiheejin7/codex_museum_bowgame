<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>QR 문제 풀기 · 궁사의 탐험 수첩</title><link rel="stylesheet" href="css/style.css"><script defer src="js/data.js"></script><script defer src="js/storage.js"></script><script defer src="js/quiz.js"></script></head>
<body><main class="app"><header class="masthead"><span>궁사의 탐험 수첩</span><span class="edition">DISCOVERY</span></header><section id="quiz-content"><p class="eyebrow" id="quiz-code">QR · 탐험 문제</p><h1>조각을 찾았어요!</h1><p class="muted">문제를 풀면 수집북에 새 조각이 채워집니다.</p><div class="quiz-card"><p class="reward-label">획득 가능한 아이템</p><h2 id="quiz-item"></h2><form id="answer-form"><p id="question" class="question"></p><label for="answer">정답을 입력하세요</label><input id="answer" name="answer" type="text" inputmode="numeric" autocomplete="off" required placeholder="숫자 입력" aria-describedby="question"><button class="button" type="submit">정답 확인</button><p id="save-error" class="error-text" role="alert"></p></form><div id="feedback" class="feedback" role="status" aria-live="polite" hidden><span id="feedback-icon" class="feedback-icon" aria-hidden="true"></span><h2 id="feedback-title"></h2><p id="feedback-description"></p><div id="reward" class="reward" hidden><img id="reward-image" alt=""><strong id="reward-name"></strong></div><button id="retry" class="button" type="button" hidden>다시 시도</button></div></div><a id="return-link" class="button secondary" href="collection.html">수집북으로 돌아가기</a><p class="footnote">틀려도 괜찮아요. 몇 번이든 다시 도전할 수 있어요.</p></section><section id="invalid-quiz" hidden><p class="eyebrow">QR 확인 안내</p><h1>문제를 찾을 수 없어요.</h1><p>올바르지 않거나 누락된 QR 주소입니다. 수집북으로 돌아가 다른 QR을 열어주세요.</p><a class="button" href="collection.html">수집북으로 돌아가기</a></section></main></body></html>
